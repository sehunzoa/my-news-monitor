name: Daily Web Monitor

on:
  schedule:
    # 每天 UTC 0:00 (即北京时间每天上午 8:00) 自动触发运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你随时手动点击按钮触发运行

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install playwright deep-translator
          playwright install chromium

      - name: 执行监控与网页生成脚本
        run: python monitor.py

      - name: 自动把生成的网页提交并发布到 GitHub Pages
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update daily summary dashboard"
          file_pattern: "index.html"
